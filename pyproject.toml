[project]
name = "mtmct"
version = "0.1.0"
description = "MTMCT PoC: multi-camera person tracking with metrics UI"
readme = "README.md"
authors = [
    { name = "Chillibumbik", email = "bm53557@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "imageio-ffmpeg>=0.8.0",
    "motmetrics>=1.4.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openvino>=2026.4.1",
    "pandas>=3.1.0",
    "pandera[pandas]>=0.35.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "supervision>=0.31.3",
    "trackers>=2.6.1",
    "trackeval",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mtmct = "mtmct:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
export = [
    "onnx>=1.23.2",
    "torch>=2.15.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
    "third_party/TrackEval",
]

[tool.uv.sources]
trackeval = { workspace = true }
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs downloaded datasets",
  "slow: long-running",
  "e2e: end-to-end smoke on real data",
]
filterwarnings = ["ignore::DeprecationWarning"]
