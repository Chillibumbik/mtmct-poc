profile: overlap
data: {target_fps: 10}
# Tuned on the tune split (garden1, oracle): CAMPUS calibration is noisy (same-person cross-camera
# ground distance median 1-1.7 m, p90 up to 9 m), so geometry is a soft cost without hard gating.
associate:
  costs:
    geometry: {weight: 0.5, params: {gate_m: 5.0, hard: false}}
  solver: {name: agglomerative, params: {linkage: average, threshold: 0.55}}
