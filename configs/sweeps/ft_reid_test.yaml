  sequence: scene_041
  split: test
  mode: full
  overrides:
    reid.name: osnet_ain_x1_0_ft
    refine.split_thr: 0.95
    refine.stitch_app_thr: 0.95
    associate.solver.params.threshold: 0.25
- name: ft · reid · oracle · aic24 scene_041 test
  dataset: aic24
  sequence: scene_041
  split: test
  mode: oracle
  overrides:
    reid.name: osnet_ain_x1_0_ft
    refine.split_thr: 0.95
    refine.stitch_app_thr: 0.95
    associate.solver.params.threshold: 0.25
