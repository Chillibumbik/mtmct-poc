# Defaults for every run. Profiles and datasets override; UI overrides use dotted keys.
data:
  target_fps: 10
  max_rss_gb: 9.0
detect: {name: yolox_s, params: {conf: 0.3, nms: 0.45, input_size: 640}}
track: {name: bytetrack, params: {}}
# `batch` is ignored (the pipeline batches crops, stages.REID_BATCH); it stays only to keep reid cache keys valid.
reid: {name: osnet_ain_x1_0, params: {batch: 32}}
# T13a (garden1 tune, osnet_ain_x1_0; confirmed on garden2 test and terrace1): cutting tracklets at appearance
# jumps is the main lever against in-camera ID switches. Thresholds are on the ReID model's cosine scale;
# stitch_app_thr must be >= split_thr, otherwise stitching glues the cut parts back.
refine: {enabled: true, split_thr: 0.75, stitch_app_thr: 0.75, window: 7}
portrait: {reid_stride: 3, top_k: 10}
geometry: {foot_point: {name: bottom_center}, smooth_window: 5}
associate:
  costs:
    appearance: {weight: 1.0, params: {agg: mean}}
  constraints: {same_camera_overlap: cannot_link}
  rerank: null
  solver: {name: agglomerative, params: {linkage: average, threshold: 0.45}}
postprocess: {min_global_len: 10, drop_short_single_camera: true}
eval: {iou: 0.5}
