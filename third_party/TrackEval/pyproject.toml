[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trackeval"
version = "1.0.dev1+mtmct"
description = "TrackEval (vendored, numpy>=1.24 patched)"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["trackeval*"]
